<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src __CSP__ 'unsafe-inline' https:; font-src __CSP__ data: https:; img-src __CSP__ data: https:; script-src 'nonce-__NONCE__';">
<link rel="stylesheet" href="__CODICON_HREF__">
<style>
  :root {
    --bg: var(--vscode-editor-background);
    --fg: var(--vscode-editor-foreground);
    --dim: var(--vscode-descriptionForeground);
    --border: var(--vscode-panel-border, var(--vscode-editorGroup-border, rgba(128,128,128,.25)));
    --hover: var(--vscode-list-hoverBackground);
    --sel: var(--vscode-list-activeSelectionBackground);
    --selfg: var(--vscode-list-activeSelectionForeground);
    --inactsel: var(--vscode-list-inactiveSelectionBackground);
    --mono: var(--vscode-editor-font-family, Consolas, monospace);
    --monosize: 11px;   /* set from the page's zoom (Ctrl +/-/0, Ctrl+wheel) */
    --add-line: var(--vscode-diffEditor-insertedLineBackground, rgba(155,185,85,.15));
    --del-line: var(--vscode-diffEditor-removedLineBackground, rgba(255,0,0,.12));
    --add-text: var(--vscode-diffEditor-insertedTextBackground, rgba(155,185,85,.35));
    --del-text: var(--vscode-diffEditor-removedTextBackground, rgba(255,0,0,.3));
    --add-fg: var(--vscode-gitDecoration-addedResourceForeground, #81b88b);
    --del-fg: var(--vscode-gitDecoration-deletedResourceForeground, #c74e39);
    --mod-fg: var(--vscode-gitDecoration-modifiedResourceForeground, #e2c08d);
    --ren-fg: var(--vscode-gitDecoration-renamedResourceForeground, #73c991);
    --unt-fg: var(--vscode-gitDecoration-untrackedResourceForeground, #73c991);
    --gutter: var(--vscode-editorLineNumber-foreground, #858585);
    --hdr-bg: var(--vscode-sideBarSectionHeader-background, var(--vscode-editorGroupHeader-tabsBackground, rgba(128,128,128,.08)));
    --tabs-bg: var(--vscode-editorGroupHeader-tabsBackground, var(--hdr-bg));
    --badge-bg: var(--vscode-badge-background);
    --badge-fg: var(--vscode-badge-foreground);
    --focus: var(--vscode-focusBorder);
    --link: var(--vscode-textLink-foreground);
    --menu-bg: var(--vscode-menu-background, var(--vscode-editorWidget-background, var(--bg)));
    --menu-fg: var(--vscode-menu-foreground, var(--fg));
    --menu-sel: var(--vscode-menu-selectionBackground, var(--sel));
    --menu-selfg: var(--vscode-menu-selectionForeground, var(--selfg));
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--fg); font-family: var(--vscode-font-family); font-size: var(--vscode-font-size, 13px);
         display: flex; flex-direction: column; overflow: hidden; }
  button.icon { background: none; border: 0; color: var(--fg); cursor: pointer; padding: 3px; border-radius: 4px; line-height: 0; opacity: .85; }
  button.icon:hover { background: var(--vscode-toolbar-hoverBackground, var(--hover)); opacity: 1; }
  button.icon:disabled { opacity: .35; cursor: default; background: none; }
  button.icon.on, button.tgl.on { background: var(--vscode-inputOption-activeBackground, var(--inactsel)); color: var(--vscode-inputOption-activeForeground, var(--fg)); opacity: 1; }
  button.tgl { background: none; border: 1px solid var(--border); color: var(--fg); cursor: pointer; padding: 1px 8px; border-radius: 3px; font: inherit; font-size: 12px; }
  button.tgl:hover { background: var(--vscode-toolbar-hoverBackground, var(--hover)); }
  button.icon:focus-visible, button.tgl:focus-visible, .row:focus-visible, .tab:focus-visible { outline: 1px solid var(--focus); outline-offset: -1px; }
  .plus { color: var(--add-fg); } .minus { color: var(--del-fg); }
  .dim { color: var(--dim); }

  /* ---------- header ---------- */
  #head { display: flex; align-items: center; gap: 8px; padding: 5px 8px 5px 12px; border-bottom: 1px solid var(--border); min-height: 35px; flex: none; }
  #head .wt { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; cursor: pointer; min-width: 0; flex: 0 1 auto; }
  #head .wt:hover { text-decoration: underline; }
  #head .br { display: inline-flex; align-items: center; gap: 4px; color: var(--dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; flex: 0 2 auto; }
  .sync { display: inline-flex; gap: 6px; color: var(--dim); font-size: 12px; white-space: nowrap; border: 1px solid var(--border); border-radius: 10px; padding: 0 8px; line-height: 18px; flex: none; }
  .sync:empty { display: none; }
  .sync .up { color: var(--link); }
  #head .grow { flex: 1; }
  #filter { background: var(--vscode-input-background); color: var(--vscode-input-foreground); border: 1px solid var(--vscode-input-border, transparent);
            border-radius: 2px; padding: 2px 6px; width: 140px; min-width: 60px; flex: 0 1 140px; font: inherit; font-size: 12px; }
  #filter:focus { outline: 1px solid var(--focus); outline-offset: -1px; }
  #menu { position: fixed; z-index: 20; min-width: 220px; background: var(--menu-bg); color: var(--menu-fg); border: 1px solid var(--vscode-menu-border, var(--border));
          border-radius: 5px; padding: 4px 0; box-shadow: 0 2px 8px var(--vscode-widget-shadow, rgba(0,0,0,.36)); }
  #menu[hidden] { display: none; }
  #menu .mi { display: flex; align-items: center; gap: 8px; padding: 0 12px; height: 26px; cursor: pointer; white-space: nowrap; }
  #menu .mi:hover, #menu .mi:focus { background: var(--menu-sel); color: var(--menu-selfg); outline: none; }
  #menu .mi .k { margin-left: auto; padding-left: 16px; opacity: .7; font-size: 12px; }
  #menu .sep { height: 1px; margin: 4px 0; background: var(--vscode-menu-separatorBackground, var(--border)); }

  /* ---------- top band: commits | message + file tree ---------- */
  #top { flex: none; display: flex; min-height: 80px; height: 38vh; }
  #list { width: 44%; min-width: 0; overflow: auto; border-right: 1px solid var(--border); }
  #side { flex: 1; min-width: 0; display: flex; flex-direction: column; overflow: hidden; }
  #tree { flex: 1; overflow: auto; min-height: 0; }
  .sec { font-size: 11px; text-transform: uppercase; letter-spacing: .04em; color: var(--dim); padding: 6px 12px 2px; user-select: none; }
  .row { display: flex; align-items: center; gap: 6px; padding: 0 10px 0 12px; height: 22px; cursor: pointer; white-space: nowrap; user-select: none; }
  .row:hover { background: var(--hover); }
  .row.sel { background: var(--inactsel); }
  .focus .row.sel { background: var(--sel); color: var(--selfg); }
  .focus .row.sel .meta, .focus .row.sel .dim, .focus .row.sel .plus, .focus .row.sel .minus, .focus .row.sel .st { color: inherit; opacity: .9; }
  .row .codicon { flex: none; }
  .row .subj { overflow: hidden; text-overflow: ellipsis; flex: 1; min-width: 0; }
  .row .meta { color: var(--dim); font-size: 12px; flex: none; }
  .row .meta .sha { font-family: var(--mono); }
  .row .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--link); flex: none; }
  .row .dot.pushed { background: transparent; border: 1px solid var(--dim); opacity: .5; }
  .row.working .codicon { color: var(--mod-fg); }
  .row.note { color: var(--dim); cursor: default; font-size: 12px; }
  .row.note:hover { background: none; }
  .row .count { background: var(--badge-bg); color: var(--badge-fg); border-radius: 10px; padding: 0 6px; font-size: 11px; line-height: 16px; }

  #meta { flex: 0 1 auto; max-height: 65%; overflow: auto; border-bottom: 1px solid var(--border); padding: 5px 12px; font-size: 12px; }
  #meta:empty { display: none; }
  #meta .line { display: flex; align-items: baseline; gap: 6px; min-width: 0; white-space: nowrap; }
  #meta .s { font-weight: 600; font-size: 13px; overflow: hidden; text-overflow: ellipsis; min-width: 0; flex: 0 1 auto; }
  #meta .info { color: var(--dim); flex: none; display: inline-flex; gap: 6px; }
  #meta .tog { background: none; border: 0; padding: 0; color: var(--link); cursor: pointer; font: inherit; flex: none; }
  #meta .tog:hover { text-decoration: underline; }
  #meta .more { margin-top: 4px; }
  #meta .more .s2 { font-weight: 600; white-space: pre-wrap; word-break: break-word; }
  #meta .more .b { white-space: pre-wrap; word-break: break-word; opacity: .85; margin: 4px 0; }
  #meta .more .a { color: var(--dim); display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
  #meta .copy { font-family: var(--mono); cursor: pointer; }
  #meta .copy:hover { color: var(--link); }
  #tree .row { padding-left: calc(12px + var(--i, 0) * 14px); }
  #tree .row.dir { color: var(--dim); }
  #tree .row.dir .codicon { transition: transform .1s; }
  #tree .row.dir.folded .chev { transform: rotate(-90deg); }
  #tree .row .nm { overflow: hidden; text-overflow: ellipsis; flex: 1; min-width: 0; }
  #tree .row .n { font-family: var(--mono); font-size: 11px; flex: none; }
  .st { font-family: var(--mono); font-size: 11px; font-weight: 700; width: 14px; text-align: center; flex: none; }
  .st-M { color: var(--mod-fg); } .st-A { color: var(--add-fg); } .st-U { color: var(--unt-fg); } .st-D { color: var(--del-fg); } .st-R { color: var(--ren-fg); }

  #sash { flex: none; height: 6px; cursor: row-resize; background: var(--tabs-bg); border-top: 1px solid var(--border); display: flex; align-items: center; justify-content: center; }
  #sash::after { content: ''; width: 36px; height: 2px; border-radius: 1px; background: var(--dim); opacity: .4; }
  #sash:hover, #sash.drag { background: var(--focus); }

  /* ---------- bottom pane: Diff + one tab per staged preview ---------- */
  #tabs { flex: none; display: flex; background: var(--tabs-bg); border-bottom: 1px solid var(--border); overflow-x: auto; overflow-y: hidden; }
  #tabs::-webkit-scrollbar { height: 3px; }
  .tab { display: inline-flex; align-items: center; gap: 6px; background: none; border: 0; border-bottom: 2px solid transparent; color: var(--vscode-tab-inactiveForeground, var(--dim));
         padding: 5px 12px 4px; font: inherit; font-size: 12px; cursor: pointer; white-space: nowrap; max-width: 280px; }
  .tab span.t { overflow: hidden; text-overflow: ellipsis; }
  .tab:hover { color: var(--fg); }
  .tab.on { color: var(--vscode-tab-activeForeground, var(--fg)); border-bottom-color: var(--vscode-panelTitle-activeBorder, var(--focus)); background: var(--bg); }
  #pane { flex: 1; min-height: 0; display: flex; flex-direction: column; position: relative; }
  #dv { flex: 1; min-height: 0; display: flex; flex-direction: column; }
  #dv[hidden], #pv[hidden] { display: none; }
  .fh { flex: none; display: flex; align-items: center; gap: 6px; padding: 0 6px 0 12px; height: 30px; background: var(--hdr-bg); border-bottom: 1px solid var(--border); white-space: nowrap; }
  .fh .name { font-weight: 600; }
  .fh .dir { color: var(--dim); overflow: hidden; text-overflow: ellipsis; min-width: 0; flex: 1; direction: rtl; text-align: left; }
  .fh .stat { font-size: 11px; font-family: var(--mono); display: inline-flex; gap: 6px; align-items: center; }
  .fh .nav { display: inline-flex; align-items: center; gap: 0; color: var(--dim); font-size: 12px; }
  .fh .nav .pos { min-width: 42px; text-align: center; font-variant-numeric: tabular-nums; }
  .bar { display: inline-flex; gap: 1px; }
  .bar i { width: 7px; height: 7px; border-radius: 1px; background: var(--dim); opacity: .3; display: inline-block; }
  .bar i.a { background: var(--add-fg); opacity: 1; } .bar i.d { background: var(--del-fg); opacity: 1; }
  #fb { flex: 1; min-height: 0; overflow: auto; font-family: var(--mono); font-size: var(--monosize); line-height: 1.45; }
  #pv { flex: 1; min-height: 0; width: 100%; border: 0; background: transparent; display: block; }

  table.d { border-collapse: collapse; min-width: 100%; table-layout: auto; }
  table.d td { padding: 0; vertical-align: top; }
  td.ln { width: 1%; min-width: 34px; padding: 0 8px !important; text-align: right; color: var(--gutter); user-select: none; font-size: .92em; opacity: .9; }
  td.mk { width: 14px; user-select: none; color: var(--dim); text-align: center; }
  td.c { white-space: pre; padding-right: 16px !important; }
  tr.add td.c, tr.add td.mk { background: var(--add-line); } tr.add td.ln { background: var(--add-line); }
  tr.del td.c, tr.del td.mk { background: var(--del-line); } tr.del td.ln { background: var(--del-line); }
  tr.add td.mk { color: var(--add-fg); } tr.del td.mk { color: var(--del-fg); }
  ins { background: var(--add-text); text-decoration: none; border-radius: 2px; }
  del { background: var(--del-text); text-decoration: none; border-radius: 2px; }
  tr.hunk td { background: var(--vscode-editorInfo-background, rgba(80,140,220,.08)); color: var(--dim); font-size: .92em; padding: 2px 0 !important; }
  tr.hunk td.c { padding-left: 4px !important; }
  tr.eof td.c { color: var(--dim); font-style: italic; }
  /* split view */
  table.split td.c { width: 50%; }
  table.split td.ln.r { border-left: 1px solid var(--border); }
  table.split td.c.add, table.split td.ln.add { background: var(--add-line); }
  table.split td.c.del, table.split td.ln.del { background: var(--del-line); }
  table.split td.c.empty, table.split td.ln.empty { background: repeating-linear-gradient(-45deg, transparent 0 4px, rgba(128,128,128,.07) 4px 8px); }

  ::-webkit-scrollbar { width: 10px; height: 10px; }
  ::-webkit-scrollbar-track, ::-webkit-scrollbar-corner { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--vscode-scrollbarSlider-background, rgba(121,121,121,.4)); }
  ::-webkit-scrollbar-thumb:hover { background: var(--vscode-scrollbarSlider-hoverBackground, rgba(100,100,100,.7)); }
  ::-webkit-scrollbar-thumb:active { background: var(--vscode-scrollbarSlider-activeBackground, rgba(191,191,191,.4)); }
  .msg { color: var(--dim); padding: 14px 16px; font-size: 12px; display: flex; gap: 8px; align-items: center; font-family: var(--vscode-font-family); }
  .msg button { background: var(--vscode-button-secondaryBackground); color: var(--vscode-button-secondaryForeground); border: 0; padding: 3px 10px; border-radius: 2px; cursor: pointer; font: inherit; }
  .msg button:hover { background: var(--vscode-button-secondaryHoverBackground); }
  #empty { display: flex; flex-direction: column; align-items: center; justify-content: center; flex: 1; gap: 10px; color: var(--dim); text-align: center; padding: 20px; }
  #empty .codicon { font-size: 32px !important; opacity: .5; }
  body.nosession #top, body.nosession #sash, body.nosession #tabs, body.nosession #pane { display: none; }
  body:not(.nosession) #empty { display: none; }
  .busy { position: absolute; top: 0; left: 0; right: 0; height: 2px; overflow: hidden; z-index: 5; }
  .busy::after { content: ''; position: absolute; left: -30%; width: 30%; height: 100%; background: var(--vscode-progressBar-background, var(--focus)); animation: slide 1s linear infinite; }
  @keyframes slide { to { left: 100%; } }

  /* narrow panel: the two top-band columns stack; the bottom pane stays at the bottom */
  @media (max-width: 560px) {
    #top { flex-direction: column; height: 50vh; }
    #list { width: auto; flex: 0 0 40%; border-right: 0; border-bottom: 1px solid var(--border); }
    #side { min-height: 0; }
    #head .br { display: none; }
  }
</style>
</head>
<body class="nosession">
  <div id="head">
    <span class="codicon codicon-git-compare" style="opacity:.8"></span>
    <span class="wt" id="wt" title="Show changes for another worktree" tabindex="0">No session</span>
    <span class="br" id="br"></span>
    <span class="sync" id="sync"></span>
    <span class="grow"></span>
    <input id="filter" placeholder="Filter files" spellcheck="false">
    <button class="tgl" id="bMode" title="Side-by-side view">Split</button>
    <button class="icon" id="bMore" title="More actions"><span class="codicon codicon-ellipsis"></span></button>
  </div>
  <div id="menu" hidden></div>
  <div id="empty"><span class="codicon codicon-git-compare"></span><div>Open a session to see its commits and changes here.</div></div>
  <div id="top">
    <div id="list" tabindex="0"></div>
    <div id="side">
      <div id="meta"></div>
      <div id="tree" tabindex="0"></div>
    </div>
  </div>
  <div id="sash" title="Drag to resize"></div>
  <div id="tabs" role="tablist"></div>
  <div id="pane">
    <div id="dv"></div>
    <iframe id="pv" hidden sandbox="allow-scripts" title="Staged preview"></iframe>
  </div>

<script nonce="__NONCE__">
(function () {
  const vs = acquireVsCodeApi();
  const $ = (id) => document.getElementById(id);
  const esc = (s) => String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  const WORKING = '~working';
  const st = Object.assign({ topH: 0, mode: 'unified', fs: 11, tabs: {} }, vs.getState() || {});
  const save = () => vs.setState(st);
  // code font size: persisted, 8–20px
  function setFont(px) {
    st.fs = Math.max(8, Math.min(20, px)); save();
    document.documentElement.style.setProperty('--monosize', st.fs + 'px');
  }
  setFont(st.fs);
  let diffSig = '';
  let list = null, diff = null, sel = WORKING, hideTests = false, filterText = '';
  let file = null;                 // path shown in the Diff tab
  const fileBySel = {};            // selection → the file last viewed there
  const folded = {};               // tree dir → collapsed
  let msgOpen = false;
  let previews = [], tab = 'diff'; // staged preview labels (plan first); 'diff' | 'pv:<label>'
  let pvShown = null;              // { label, sig } loaded in the iframe
  const pvY = {};                  // preview label → scroll offset, kept across re-stages
  const targetKey = (t) => (t ? t.slug + '/' + t.name : '');

  const listEl = $('list'), treeEl = $('tree'), metaEl = $('meta'), topEl = $('top'), sash = $('sash'),
    tabsEl = $('tabs'), paneEl = $('pane'), dvEl = $('dv'), pvEl = $('pv');

  // ---------- layout: draggable split between the top band and the bottom pane ----------
  const fitTop = () => { if (st.topH) topEl.style.height = Math.max(80, Math.min(window.innerHeight - 140, st.topH)) + 'px'; };
  fitTop();
  window.addEventListener('resize', fitTop);
  sash.addEventListener('mousedown', (e) => {
    e.preventDefault(); sash.classList.add('drag');
    pvEl.style.pointerEvents = 'none';   // the iframe would swallow mousemove
    const y0 = e.clientY, h0 = topEl.offsetHeight;
    const mv = (ev) => { topEl.style.height = Math.max(80, Math.min(window.innerHeight - 140, h0 + ev.clientY - y0)) + 'px'; };
    const up = () => { sash.classList.remove('drag'); pvEl.style.pointerEvents = ''; document.removeEventListener('mousemove', mv); document.removeEventListener('mouseup', up);
      st.topH = topEl.offsetHeight; save(); };
    document.addEventListener('mousemove', mv); document.addEventListener('mouseup', up);
  });
  sash.addEventListener('dblclick', () => { st.topH = 0; save(); topEl.style.height = ''; });
  for (const el of [listEl, treeEl]) {
    el.addEventListener('focus', () => el.classList.add('focus'));
    el.addEventListener('blur', () => el.classList.remove('focus'));
  }

  // ---------- header ----------
  $('wt').addEventListener('click', () => vs.postMessage({ cmd: 'pick' }));
  document.addEventListener('keydown', (e) => {
    if (!e.ctrlKey && !e.metaKey) return;
    if (e.key === '=' || e.key === '+') { e.preventDefault(); setFont(st.fs + 1); }
    else if (e.key === '-') { e.preventDefault(); setFont(st.fs - 1); }
    else if (e.key === '0') { e.preventDefault(); setFont(11); }
  });
  document.addEventListener('wheel', (e) => { if (!e.ctrlKey) return; e.preventDefault(); setFont(st.fs + (e.deltaY < 0 ? 1 : -1)); }, { passive: false });
  $('bMode').addEventListener('click', () => { st.mode = st.mode === 'split' ? 'unified' : 'split'; save(); syncButtons(); renderDiff(true); });
  $('filter').addEventListener('input', (e) => { filterText = e.target.value.trim().toLowerCase(); renderSide(); renderDiff(true); });
  function syncButtons() {
    $('bMode').classList.toggle('on', st.mode === 'split');
    $('bMode').title = st.mode === 'split' ? 'Showing side-by-side · click for inline' : 'Showing inline · click for side-by-side';
  }

  // ⋯ menu: the toolbar actions that don't need to be one click away
  const menuEl = $('menu');
  const MENU = () => [
    { icon: 'zoom-in', label: 'Larger code', key: 'Ctrl =', run: () => setFont(st.fs + 1), keep: true },
    { icon: 'zoom-out', label: 'Smaller code', key: 'Ctrl -', run: () => setFont(st.fs - 1), keep: true },
    { icon: 'text-size', label: 'Reset code size', key: 'Ctrl 0', run: () => setFont(11) },
    '-',
    { icon: hideTests ? 'beaker' : 'beaker-stop', label: hideTests ? 'Show test files' : 'Hide test files', run: () => vs.postMessage({ cmd: 'toggleTests' }) },
    { icon: 'diff-multiple', label: 'Open all in the diff editor', run: () => vs.postMessage({ cmd: 'openAll', sel }), off: !diff || !diff.files.length },
    '-',
    { icon: 'refresh', label: 'Refresh', run: () => vs.postMessage({ cmd: 'refresh' }) },
    { icon: 'list-selection', label: 'Show another worktree…', run: () => vs.postMessage({ cmd: 'pick' }) },
  ];
  let menuItems = [];
  function openMenu() {
    menuItems = MENU();
    menuEl.innerHTML = menuItems.map((m, i) => m === '-' ? '<div class="sep"></div>'
      : '<div class="mi" tabindex="-1" data-i="' + i + '"' + (m.off ? ' style="opacity:.4;pointer-events:none"' : '') + '><span class="codicon codicon-' + m.icon + '"></span>'
        + esc(m.label) + (m.key ? '<span class="k">' + m.key + '</span>' : '') + '</div>').join('');
    menuEl.hidden = false;
    const r = $('bMore').getBoundingClientRect();
    menuEl.style.top = (r.bottom + 2) + 'px';
    menuEl.style.left = Math.max(4, Math.min(window.innerWidth - menuEl.offsetWidth - 4, r.right - menuEl.offsetWidth)) + 'px';
    const first = menuEl.querySelector('.mi'); if (first) first.focus();
  }
  const closeMenu = () => { menuEl.hidden = true; };
  $('bMore').addEventListener('click', (e) => { e.stopPropagation(); if (menuEl.hidden) openMenu(); else closeMenu(); });
  menuEl.addEventListener('click', (e) => {
    const it = e.target.closest('.mi'); if (!it) return;
    const m = menuItems[+it.dataset.i]; m.run();
    if (!m.keep) closeMenu();
  });
  menuEl.addEventListener('keydown', (e) => {

    }
    else if (m.type === 'list') {
      const newTarget = !list || targetKey(list.target) !== targetKey(m.target);
      list = m;
      if (newTarget) {
        diff = null; file = null; msgOpen = false; previews = []; pvShown = null; pvEl.removeAttribute('srcdoc');
        for (const k of Object.keys(fileBySel)) delete fileBySel[k];
        for (const k of Object.keys(folded)) delete folded[k];
        sel = m.sel || (m.changes ? WORKING : (m.commits[0] && m.commits[0].sha) || WORKING);
        pendingTab = st.tabs[targetKey(m.target)] || null;
        setTab('diff'); dvEl.innerHTML = ''; metaEl.innerHTML = ''; treeEl.innerHTML = '';
      }
      else if (m.sel) sel = m.sel;
      // selection vanished (commit amended away, working tree cleaned) → nearest sensible row
      const valid = (s) => (s === WORKING ? m.changes > 0 : m.commits.some((c) => c.sha === s));
      if (!valid(sel)) { sel = m.changes ? WORKING : (m.commits[0] && m.commits[0].sha) || WORKING; }
      renderList(); renderTabs();
      if (!diff || diff.sel !== sel || newTarget) { busy(true); vs.postMessage({ cmd: 'select', sel }); }
    }
    else if (m.type === 'diff') {
      if (m.sel !== sel) return;   // a stale answer for a row we've moved off
      const same = diff && diff.sel === m.sel;
      const sig = JSON.stringify([m.files, m.meta, m.omitted]);
      if (same && sig === diffSig) { busy(false); return; }
      diffSig = sig;
      diff = m; busy(false); renderSide(); renderDiff(same);
    }
    else if (m.type === 'previews') {
      if (!forUs(m.target)) return;
      previews = m.labels || [];
      if (pendingTab && previews.includes(pendingTab.slice(3))) { const t = pendingTab; pendingTab = null; setTab(t); }
      else if (tab !== 'diff' && !previews.includes(tab.slice(3))) setTab('diff');
      else renderTabs();
    }
    else if (m.type === 'preview') {
      if (!forUs(m.target)) return;
      if (tab !== 'pv:' + m.label) { if (pvShown && pvShown.label === m.label) pvShown = null; return; }
      if (pvShown && pvShown.label === m.label && pvShown.sig === m.sig) return;
      pvShown = { label: m.label, sig: m.sig };
      pvEl.srcdoc = m.html;
    }
    else if (m.type === 'tab') {
      st.tabs[targetKey(m.target)] = m.tab; save();
      if (!forUs(m.target)) return;
      if (m.tab === 'diff' || previews.includes(m.tab.slice(3))) setTab(m.tab); else pendingTab = m.tab;
    }
  });
  syncButtons();
  renderList();
  vs.postMessage({ cmd: 'ready' });
})();
</script>
